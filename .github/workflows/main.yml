name: Release

on:
  push:
    # tags:
    #   - 'v*' # trigger on version tags like v0.1.0
  workflow_dispatch: # allow manual triggering

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libxinerama-dev libx11-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare distribution
        run: |
          # Copy lua/ported to build/scripts
          cp -r lua/ported build/scripts
          
          # Copy config.toml
          cp config.toml build/
          
          # Copy and rename font
          cp FiraCode-Regular.ttf build/font.ttf
          
          # Clone Drizzle.Data community branch
          git clone --depth 1 --branch community https://github.com/SlimeCubed/Drizzle.Data.git build/data
          
          # Create logs directory
          mkdir -p build/logs
          
          # Copy splash screen and icon
          cp splashscreen.png build/
          cp icon.png build/

      - name: Create distribution zip
        run: |
          cd build
          zip -r ../Orbit-linux.zip Orbit logs/ data/ font.ttf scripts/ splashscreen.png icon.png config.toml

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-linux
          path: Orbit-linux.zip

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare distribution
        run: |
          # Copy lua/ported to build/scripts
          xcopy /E /I lua\ported build\scripts
          
          # Copy config.toml
          copy config.toml build\
          
          # Copy and rename font
          copy FiraCode-Regular.ttf build\font.ttf
          
          # Clone Drizzle.Data community branch
          git clone --depth 1 --branch community https://github.com/SlimeCubed/Drizzle.Data.git build\data
          
          # Create logs directory
          if not exist build\logs mkdir build\logs
          
          # Copy splash screen and icon
          copy splashscreen.png build\
          copy icon.png build\

      - name: Create distribution zip
        run: |
          cd build
          7z a ..\Orbit-windows.zip Orbit.exe logs\ data\ font.ttf scripts\ splashscreen.png icon.png config.toml

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-windows
          path: Orbit-windows.zip

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Read changelog
        id: changelog
        run: |
          DESC=$(cat changelog.txt)
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$DESC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Orbit v${{ steps.version.outputs.VERSION }}
          body: ${{ env.RELEASE_BODY }}
          files: |
            dist/Orbit-linux/Orbit-linux.zip
            dist/Orbit-windows/Orbit-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
